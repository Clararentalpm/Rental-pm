# Deploy Rental PM (V6.5.2) from Rental Management/ to GitHub Pages.
# Free hosting alternative while Netlify production deploys are paused.

name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - cursor/phase1-stabilize-v652-930a
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Block Pages deploy if the SPA script cannot parse (P0 class: infinite Loading).
  js-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: node --check inline script
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const { spawnSync } = require('child_process');
          const html = fs.readFileSync('Rental Management/index.html', 'utf8');
          const m = html.match(/<script>([\s\S]*?)<\/script>/);
          if (!m) { console.error('No inline <script>'); process.exit(1); }
          fs.writeFileSync('/tmp/rental-pm-pages-check.js', m[1]);
          const r = spawnSync('node', ['--check', '/tmp/rental-pm-pages-check.js'], { encoding: 'utf8' });
          if (r.status !== 0) { console.error(r.stderr || r.stdout); process.exit(r.status || 1); }
          console.log('node --check OK');
          NODE
      - name: Login boot regression
        run: node "Rental Management/login-boot-regression-test.js"

  deploy:
    needs: js-syntax
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "Rental Management"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
