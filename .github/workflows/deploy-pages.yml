# Deploy Rental PM (V6.5.2) from Rental Management/ to GitHub Pages.
# Free hosting alternative while Netlify production deploys are paused.

name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - cursor/phase1-stabilize-v652-930a
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "Rental Management"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
